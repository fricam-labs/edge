name: Container

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - run: ./update_test.sh
      - run: go test -race ./...

  publish:
    if: github.event_name == 'release'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/fricam-labs/edge
          tags: |
            type=raw,value=latest
            type=raw,value=stable
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            RUN_RACE_TESTS=0
            VERSION=${{ github.event.release.tag_name }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Upload verified installation assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          asset_dir="${RUNNER_TEMP}/fricam-edge-assets"
          mkdir -p "${asset_dir}"
          cp install.sh compose.yml update.sh \
            systemd/fricam-edge-update.service \
            systemd/fricam-edge-update.timer "${asset_dir}/"
          (cd "${asset_dir}" && sha256sum compose.yml update.sh \
            fricam-edge-update.service fricam-edge-update.timer > SHA256SUMS)
          gh release upload "${GITHUB_REF_NAME}" "${asset_dir}"/* --clobber
